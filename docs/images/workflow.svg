<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <rect width="1200" height="260" fill="#0f172a"/>
  <style>
    .title{font:700 20px 'Segoe UI',sans-serif;fill:#e2e8f0}
    .step{fill:#1e293b;stroke:#6366f1;stroke-width:2;rx:14}
    .txt{font:600 16px 'Segoe UI',sans-serif;fill:#e2e8f0}
    .sub{font:400 13px 'Segoe UI',sans-serif;fill:#94a3b8}
    .arrow{stroke:#64748b;stroke-width:3;marker-end:url(#m)}
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="24" y="38" class="title">推荐操作流程（5步）</text>

  <rect x="24" y="70" width="210" height="130" class="step"/>
  <text x="40" y="104" class="txt">1. 上传图片</text>
  <text x="40" y="132" class="sub">支持拖拽 / 点击上传</text>

  <line x1="240" y1="135" x2="286" y2="135" class="arrow"/>

  <rect x="292" y="70" width="210" height="130" class="step"/>
  <text x="308" y="104" class="txt">2. 选择工具</text>
  <text x="308" y="132" class="sub">矩形 / 套索 / 魔棒 / 自动</text>

  <line x1="508" y1="135" x2="554" y2="135" class="arrow"/>

  <rect x="560" y="70" width="210" height="130" class="step"/>
  <text x="576" y="104" class="txt">3. 删除背景</text>
  <text x="576" y="132" class="sub">保留主体，透明化背景</text>

  <line x1="776" y1="135" x2="822" y2="135" class="arrow"/>

  <rect x="828" y="70" width="210" height="130" class="step"/>
  <text x="844" y="104" class="txt">4. 精修边缘</text>
  <text x="844" y="132" class="sub">橡皮擦 + 恢复画笔</text>

  <line x1="1044" y1="135" x2="1090" y2="135" class="arrow"/>

  <rect x="1096" y="70" width="80" height="130" class="step"/>
  <text x="1111" y="104" class="txt">5.</text>
  <text x="1106" y="132" class="sub">导出</text>
</svg>
