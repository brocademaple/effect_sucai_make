<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>特效素材制作器 - 图片抠图工具</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部导航 -->
    <header class="header">
      <div class="header-left">
        <h1 class="logo">特效素材制作器</h1>
        <span class="subtitle">图片背景去除 &amp; 抠图工具</span>
      </div>
      <div class="header-right">
        <button id="btnUpload" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          上传图片
        </button>
        <input type="file" id="fileInput" accept="image/*" hidden>
        <div class="export-wrapper">
          <button id="btnExportHeader" class="btn btn-export-header" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            导出图片
            <svg class="dropdown-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <div id="exportDropdown" class="export-dropdown">
            <div class="dropdown-row">
              <label>格式</label>
              <select id="exportFormat" class="select-input">
                <option value="png">PNG（透明背景）</option>
                <option value="jpg">JPG（白色背景）</option>
                <option value="webp">WebP（透明背景）</option>
              </select>
            </div>
            <div class="dropdown-row" id="qualityGroup" style="display:none;">
              <label>质量</label>
              <div class="slider-row">
                <input type="range" id="exportQuality" min="10" max="100" value="92">
                <span id="qualityVal">92%</span>
              </div>
            </div>
            <div class="dropdown-row">
              <label class="checkbox-label">
                <input type="checkbox" id="cropToContent" checked>
                自动裁剪到内容区域
              </label>
            </div>
            <button class="btn btn-do-export" id="btnExport">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              确认导出
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- 主体内容 -->
    <div class="main-layout">
      <!-- 左侧工具栏 -->
      <aside class="toolbar">
        <div class="tool-group">
          <div class="tool-group-title">选择工具</div>
          <button class="tool-btn active" data-tool="select" title="矩形选区 (V)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="4 2"/>
            </svg>
            <span>矩形选区</span>
          </button>
          <button class="tool-btn" data-tool="lasso" title="自由套索 (L)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c1.5 0 3-.3 4.3-.9"/>
              <path d="M22 12c0-2.8-1.2-5.3-3-7"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <span>自由套索</span>
          </button>
        </div>

        <div class="tool-group">
          <div class="tool-group-title">抠图工具</div>
          <button class="tool-btn" data-tool="colorpick" title="颜色拾取去背景 (C)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 17l10 5 10-5"/>
              <path d="M2 12l10 5 10-5"/>
            </svg>
            <span>取色去背景</span>
          </button>
          <button class="tool-btn" data-tool="magicwand" title="魔棒工具 (W)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 4V2"/>
              <path d="M15 16v-2"/>
              <path d="M8 9h2"/>
              <path d="M20 9h2"/>
              <path d="M17.8 11.8L19 13"/>
              <path d="M15 9h0"/>
              <path d="M17.8 6.2L19 5"/>
              <path d="M11 6.2L9.7 5"/>
              <path d="M11 11.8L9.7 13"/>
              <line x1="2" y1="22" x2="13" y2="11"/>
            </svg>
            <span>魔棒工具</span>
          </button>
          <button class="tool-btn" data-tool="autoremove" title="自动去背景 (A)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M8 12l3 3 5-5"/>
            </svg>
            <span>自动去背景</span>
          </button>
        </div>

        <div class="tool-group">
          <div class="tool-group-title">编辑</div>
          <button class="tool-btn" data-tool="eraser" title="橡皮擦 (E)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 20H7L3 16l9-9 8 8-4 4"/>
              <path d="M6.5 13.5l5-5"/>
            </svg>
            <span>橡皮擦</span>
          </button>
          <button class="tool-btn" data-tool="restore" title="恢复画笔 (R)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 19l7-7 3 3-7 7-3-3z"/>
              <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
              <path d="M2 2l7.586 7.586"/>
              <circle cx="11" cy="11" r="2"/>
            </svg>
            <span>恢复画笔</span>
          </button>
        </div>
      </aside>

      <!-- 中间画布区域 -->
      <main class="canvas-area">
        <!-- 上传提示（初始状态） -->
        <div id="uploadHint" class="upload-hint">
          <div class="upload-icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
          <h2>拖拽图片到这里，或点击上传</h2>
          <p>支持 JPG、PNG、WebP 等常见图片格式</p>
          <button class="btn btn-primary btn-lg" id="btnUploadCenter">选择图片</button>
        </div>

        <!-- 画布容器 -->
        <div id="canvasContainer" class="canvas-container" style="display:none;">
          <div id="canvasWrapper" class="canvas-wrapper">
            <canvas id="mainCanvas"></canvas>
            <canvas id="overlayCanvas"></canvas>
          </div>
          <!-- 选区操作浮层 -->
          <div id="selectionActions" class="selection-actions" style="display:none;">
            <button class="sa-btn sa-btn-primary" id="btnDeleteSelection" title="去除选区内背景">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                <line x1="10" y1="11" x2="10" y2="17"/>
                <line x1="14" y1="11" x2="14" y2="17"/>
              </svg>
              删除背景
            </button>
            <button class="sa-btn" id="btnCancelSelection" title="取消选区">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
              取消
            </button>
          </div>
        </div>

        <!-- 底部控制栏 -->
        <div class="canvas-bottom-bar">
          <div class="bar-left">
            <span id="statusInfo">就绪</span>
            <span class="bar-separator">|</span>
            <span id="statusSize"></span>
          </div>
          <div class="bar-right">
            <button class="view-btn" id="btnMove" data-tool="move" title="移动画布 (H)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="5 9 2 12 5 15"/>
                <polyline points="9 5 12 2 15 5"/>
                <polyline points="15 19 12 22 9 19"/>
                <polyline points="19 9 22 12 19 15"/>
                <line x1="2" y1="12" x2="22" y2="12"/>
                <line x1="12" y1="2" x2="12" y2="22"/>
              </svg>
            </button>
            <span class="bar-divider"></span>
            <button class="view-btn" id="btnZoomOut" title="缩小 (-)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                <line x1="8" y1="11" x2="14" y2="11"/>
              </svg>
            </button>
            <input type="range" id="zoomSlider" class="zoom-slider" min="10" max="500" value="100">
            <span id="statusZoom" class="zoom-label">100%</span>
            <button class="view-btn" id="btnZoomIn" title="放大 (+)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                <line x1="11" y1="8" x2="11" y2="14"/>
                <line x1="8" y1="11" x2="14" y2="11"/>
              </svg>
            </button>
            <span class="bar-divider"></span>
            <button class="view-btn" id="btnFitScreen" title="适应窗口 (Ctrl+0)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
                <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
                <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
                <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
              </svg>
            </button>
          </div>
        </div>
      </main>

      <!-- 右侧属性面板 -->
      <aside class="properties-panel">
        <!-- 工具参数 -->
        <div class="panel-section" id="toolParams">
          <div class="panel-title">工具参数</div>
          <div class="param-group" id="toleranceGroup">
            <label>容差值</label>
            <div class="slider-row">
              <input type="range" id="tolerance" min="0" max="100" value="30">
              <span id="toleranceVal">30</span>
            </div>
          </div>
          <div class="param-group" id="brushSizeGroup" style="display:none;">
            <label>画笔大小</label>
            <div class="slider-row">
              <input type="range" id="brushSize" min="1" max="100" value="20">
              <span id="brushSizeVal">20</span>
            </div>
          </div>
          <div class="param-group" id="brushShapeGroup" style="display:none;">
            <label>画笔形状</label>
            <div class="shape-options">
              <button class="shape-btn active" data-shape="circle" title="圆形">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="9"/>
                </svg>
              </button>
              <button class="shape-btn" data-shape="square" title="方形">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="4" y="4" width="16" height="16"/>
                </svg>
              </button>
              <button class="shape-btn" data-shape="line" title="线形">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="3" y1="12" x2="21" y2="12" stroke-width="4" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="param-group" id="featherGroup">
            <label>羽化边缘</label>
            <div class="slider-row">
              <input type="range" id="feather" min="0" max="20" value="1">
              <span id="featherVal">1</span>
            </div>
          </div>
          <!-- 恢复画笔说明 -->
          <div class="tool-hint" id="restoreHint" style="display:none;">
            恢复画笔用于找回被误擦除的区域。在已被擦除（变透明）的位置上涂抹，即可还原该区域的原始图像内容。
          </div>
        </div>

        <!-- 预览 -->
        <div class="panel-section">
          <div class="panel-title">预览</div>
          <div class="preview-container">
            <div class="preview-bg-options">
              <button class="preview-bg-btn active" data-bg="checkerboard" title="棋盘格">
                <span class="checker-icon"></span>
              </button>
              <button class="preview-bg-btn" data-bg="white" title="白色背景">
                <span class="white-icon"></span>
              </button>
              <button class="preview-bg-btn" data-bg="black" title="黑色背景">
                <span class="black-icon"></span>
              </button>
              <button class="preview-bg-btn" data-bg="green" title="绿色背景">
                <span class="green-icon"></span>
              </button>
            </div>
            <canvas id="previewCanvas"></canvas>
          </div>
        </div>

        <!-- 操作 -->
        <div class="panel-section">
          <div class="panel-title">操作</div>
          <div class="action-buttons">
            <button class="btn btn-secondary" id="btnUndo" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="1 4 1 10 7 10"/>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
              </svg>
              撤销
            </button>
            <button class="btn btn-secondary" id="btnRedo" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/>
              </svg>
              重做
            </button>
            <button class="btn btn-secondary" id="btnReset" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
              </svg>
              重置
            </button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- 加载遮罩 -->
  <div id="loadingOverlay" class="loading-overlay" style="display:none;">
    <div class="loading-spinner"></div>
    <p id="loadingText">处理中...</p>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
